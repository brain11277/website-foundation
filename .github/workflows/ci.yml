name: ci

# Engineering-grade guardrails for a public repo:
#   1. secret-scan — gitleaks fails the build if any credential is committed.
#   2. verify-script — syntax-checks the indexing checker so it never lands broken.
# GitHub also runs native secret-scanning + push protection on public repos;
# this is the belt to that suspenders.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-script:
    name: verify-script (syntax + fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check
        run: |
          node --check scripts/verify-indexing.mjs
          node --check scripts/verify-token-parity.mjs
      # A syntax check proves the file parses and nothing else. This runs the
      # verifier for real against local fixtures served from Node's built-in
      # http module: one site that should pass, one with a dangling JSON-LD
      # @id that must fail. No network, so CI stays decoupled from any live
      # site, and the repo's own enforcement machinery is actually exercised.
      - name: fixture suite
        run: node tests/run-fixtures.mjs

  verify-starter:
    name: verify-starter (build + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires >=22.12. The verify-script job deliberately stays
          # on 20 to keep proving the zero-dependency checker runs on older
          # Node; this job has to match what the starter actually needs.
          node-version: 22
          cache: npm
          cache-dependency-path: starter/package-lock.json
      # The starter is a real Astro site, so it can be broken by a release of
      # something it depends on without anyone touching this repo. Building it
      # here is what stops "verified against Astro 7.3.3" from going stale
      # silently, and it asserts the contracts the starter claims to satisfy:
      # the indexing check, a 404 with a real body, one h1 per page, a
      # resolving entity graph, and token parity across every theme block.
      - name: build and verify the starter
        run: node tests/verify-starter.mjs --build
